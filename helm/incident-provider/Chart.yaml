apiVersion: v2
name: incident-provider
description: Krateo incident provider. It runs each Incident's precondition and verify scripts in a read-only sandbox and moves the incident through its lifecycle. The Incident CRD ships in incident-provider-crds.
type: application
version: CHART_VERSION
appVersion: "CHART_VERSION"
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - observability
  - incidents
sources:
  - https://github.com/krateo-platformops/incident-provider
annotations:
  # This release files spec.reanalysis with cause CheckNoVerdict. alert-provider before 0.2.87 takes
  # an unknown cause as a person's, and closes the incident when the answer fails instead of
  # returning it to Open. The installer's pin gate enforces the floor in both directions.
  krateo.io/requires-alert-provider: ">= 0.2.87"
