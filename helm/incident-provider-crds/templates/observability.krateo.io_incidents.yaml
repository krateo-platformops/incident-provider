---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: incidents.observability.krateo.io
spec:
  group: observability.krateo.io
  names:
    categories:
    - krateo
    - observability
    kind: Incident
    listKind: IncidentList
    plural: incidents
    shortNames:
    - inc
    singular: incident
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alertRef.name
      name: Alert
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An Incident is one occurrence of an alert's problem, from its root-cause analysis to its end. An
          Alert has any number of Incidents: while it fires, a firing an open Incident describes opens
          nothing, and a firing none describes opens a new one. Its own checks resolve it, or a
          human closes it; the Alert returning to OK does neither.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IncidentSpec is what opened the incident and what humans
              decided about it.
            properties:
              alertRef:
                description: AlertRef is the Alert that opened the incident. It is
                  immutable.
                properties:
                  name:
                    description: |-
                      Name of the Alert. It is also the value of the observability.krateo.io/alert label, so it is
                      at most 63 characters.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: Namespace of the Alert. Writers create the Incident
                      in this namespace.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: alertRef is immutable
                  rule: self == oldSelf
              applied:
                description: |-
                  Applied says a human ran the apply script: in a terminal followed by "I applied it", or with
                  the portal's Apply. The controller consumes it: it moves an Open incident to Verifying,
                  records an apply result and sets applied back to false.
                type: boolean
              closed:
                description: |-
                  Closed says a human closed the incident, or the writer did because its analysis failed (with
                  the closed-reason annotation). It moves any state to Closed and cannot be unset.
                type: boolean
              prompt:
                description: Prompt is the root-cause-analysis prompt sent to incident-agent.
                type: string
              reanalysis:
                description: |-
                  Reanalysis asks for a new root-cause analysis of an Open or Verifying incident. The writer
                  (alert-provider) consumes it: it records it in status.reanalysis, moves the incident back to
                  Analyzing, removes this field and runs the analysis again. In any other state it is removed
                  unanswered. A person sets it (the portal's re-run), or the controller does, with cause
                  ApplyActionStale, when the cluster stops serving the target of status.howToFix.applyAction.
                properties:
                  cause:
                    default: Person
                    description: 'Cause is who asked: Person (the default) or ApplyActionStale
                      (the controller).'
                    enum:
                    - Person
                    - ApplyActionStale
                    type: string
                  feedback:
                    description: Feedback is what the person asking found wrong with
                      the analysis, for the agent to address.
                    maxLength: 2000
                    type: string
                type: object
              trigger:
                description: Trigger is what started the investigation.
                enum:
                - alert
                - composition-condition
                - user-ask
                type: string
              triggeredAt:
                description: TriggeredAt is when the firing that opened the incident
                  arrived.
                format: date-time
                type: string
            required:
            - alertRef
            type: object
            x-kubernetes-validations:
            - message: closed cannot be unset
              rule: '!has(oldSelf.closed) || !oldSelf.closed || (has(self.closed)
                && self.closed)'
          status:
            description: IncidentStatus is the incident's lifecycle, its checks and
              its root-cause analysis.
            properties:
              analyzedResources:
                description: AnalyzedResources are the cluster objects the analysis
                  read.
                items:
                  description: AnalyzedResource is a cluster object the analysis read.
                  properties:
                    gvr:
                      description: GVR is the object's group/version/resource, e.g.
                        apps/v1/deployments.
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    whatWasRead:
                      description: 'WhatWasRead is what of the object the analysis
                        inspected: status, events, spec, ...'
                      type: string
                  type: object
                type: array
              assumptions:
                description: Assumptions are what the analysis assumed for lack of
                  context.
                items:
                  type: string
                type: array
              completedAt:
                description: CompletedAt is when the root-cause analysis finished.
                format: date-time
                type: string
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              error:
                description: Error is why the root-cause analysis failed.
                type: string
              howToFix:
                description: HowToFix is the fix the root-cause analysis wrote.
                properties:
                  apply:
                    description: Apply is the fix. A human reviews and runs it.
                    type: string
                  applyAction:
                    description: |-
                      ApplyAction is apply as one Kubernetes API write, when it is one. The portal's Apply sends it
                      as the clicking user, then sets spec.applied. The controller never sends it.
                    properties:
                      apiVersion:
                        description: APIVersion is the target's v1 or <group>/<version>.
                        type: string
                      name:
                        description: Name is the target's name; for create, the new
                          object's.
                        type: string
                      namespace:
                        description: Namespace is the target's namespace; empty for
                          a cluster-scoped object.
                        type: string
                      payload:
                        description: 'Payload is the body: the merge patch, or the
                          object to create. A delete has none.'
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      resource:
                        description: Resource is the target's lowercase plural resource
                          name.
                        type: string
                      verb:
                        description: Verb is patch (payload is a JSON merge patch),
                          create (payload is the object) or delete.
                        enum:
                        - patch
                        - create
                        - delete
                        type: string
                    required:
                    - apiVersion
                    - name
                    - resource
                    - verb
                    type: object
                  precondition:
                    description: |-
                      Precondition tests whether the incident still holds. It tests the root-cause object, never
                      the alert's rows.
                    type: string
                  rollback:
                    description: |-
                      Rollback undoes apply: it restores what apply changed. A human runs it to revert an applied
                      fix. The controller never runs it, and running it moves no state.
                    type: string
                  verify:
                    description: Verify tests whether the fix worked.
                    type: string
                type: object
              lastChecks:
                description: |-
                  LastChecks is the latest result of each script. It changes only when a result does, so a
                  check that keeps giving the same verdict writes nothing; each unknown run is counted in its
                  noVerdict streak, up to the bound that stops the script.
                properties:
                  apply:
                    description: LastCheck is the latest result of a script.
                    properties:
                      exit:
                        description: |-
                          Exit is the script's exit code. It is absent when the run produced none (a timeout, a pod
                          that never ran) and on the apply result that records a consumed spec.applied.
                        format: int32
                        maximum: 255
                        minimum: 0
                        type: integer
                      noVerdict:
                        description: |-
                          NoVerdict is the streak of consecutive precondition or verify runs without a verdict that
                          ends at this result, whatever their exit codes. It is set only for unknown results; a
                          verdict, 0 or 1, ends the streak.
                        properties:
                          last:
                            description: |-
                              Last is when the latest run of the streak ended. A run that ended no later is not counted
                              again.
                            format: date-time
                            type: string
                          runs:
                            description: Runs is how many runs the streak has.
                            format: int32
                            minimum: 1
                            type: integer
                          since:
                            description: Since is when the first run of the streak
                              ended.
                            format: date-time
                            type: string
                        required:
                        - last
                        - runs
                        - since
                        type: object
                      output:
                        description: |-
                          Output is what an unknown precondition or verify run printed (the end of its log, cut to 512
                          bytes), or why it gave no exit code. It is set only for unknown results, from the run that
                          started giving the result.
                        maxLength: 512
                        type: string
                      since:
                        description: |-
                          Since is when the script started giving this result. A precondition or verify run that gives
                          the same result again leaves it unchanged; every apply run sets it.
                        format: date-time
                        type: string
                    required:
                    - since
                    type: object
                  precondition:
                    description: LastCheck is the latest result of a script.
                    properties:
                      exit:
                        description: |-
                          Exit is the script's exit code. It is absent when the run produced none (a timeout, a pod
                          that never ran) and on the apply result that records a consumed spec.applied.
                        format: int32
                        maximum: 255
                        minimum: 0
                        type: integer
                      noVerdict:
                        description: |-
                          NoVerdict is the streak of consecutive precondition or verify runs without a verdict that
                          ends at this result, whatever their exit codes. It is set only for unknown results; a
                          verdict, 0 or 1, ends the streak.
                        properties:
                          last:
                            description: |-
                              Last is when the latest run of the streak ended. A run that ended no later is not counted
                              again.
                            format: date-time
                            type: string
                          runs:
                            description: Runs is how many runs the streak has.
                            format: int32
                            minimum: 1
                            type: integer
                          since:
                            description: Since is when the first run of the streak
                              ended.
                            format: date-time
                            type: string
                        required:
                        - last
                        - runs
                        - since
                        type: object
                      output:
                        description: |-
                          Output is what an unknown precondition or verify run printed (the end of its log, cut to 512
                          bytes), or why it gave no exit code. It is set only for unknown results, from the run that
                          started giving the result.
                        maxLength: 512
                        type: string
                      since:
                        description: |-
                          Since is when the script started giving this result. A precondition or verify run that gives
                          the same result again leaves it unchanged; every apply run sets it.
                        format: date-time
                        type: string
                    required:
                    - since
                    type: object
                  verify:
                    description: LastCheck is the latest result of a script.
                    properties:
                      exit:
                        description: |-
                          Exit is the script's exit code. It is absent when the run produced none (a timeout, a pod
                          that never ran) and on the apply result that records a consumed spec.applied.
                        format: int32
                        maximum: 255
                        minimum: 0
                        type: integer
                      noVerdict:
                        description: |-
                          NoVerdict is the streak of consecutive precondition or verify runs without a verdict that
                          ends at this result, whatever their exit codes. It is set only for unknown results; a
                          verdict, 0 or 1, ends the streak.
                        properties:
                          last:
                            description: |-
                              Last is when the latest run of the streak ended. A run that ended no later is not counted
                              again.
                            format: date-time
                            type: string
                          runs:
                            description: Runs is how many runs the streak has.
                            format: int32
                            minimum: 1
                            type: integer
                          since:
                            description: Since is when the first run of the streak
                              ended.
                            format: date-time
                            type: string
                        required:
                        - last
                        - runs
                        - since
                        type: object
                      output:
                        description: |-
                          Output is what an unknown precondition or verify run printed (the end of its log, cut to 512
                          bytes), or why it gave no exit code. It is set only for unknown results, from the run that
                          started giving the result.
                        maxLength: 512
                        type: string
                      since:
                        description: |-
                          Since is when the script started giving this result. A precondition or verify run that gives
                          the same result again leaves it unchanged; every apply run sets it.
                        format: date-time
                        type: string
                    required:
                    - since
                    type: object
                type: object
              missingContext:
                description: MissingContext is what the analysis could not see but
                  needed.
                items:
                  type: string
                type: array
              reanalysis:
                description: Reanalysis is the latest spec.reanalysis the writer consumed.
                properties:
                  at:
                    description: At is when the request was consumed.
                    format: date-time
                    type: string
                  cause:
                    default: Person
                    description: Cause is the request's cause; the writer copies it
                      from spec.reanalysis.cause.
                    enum:
                    - Person
                    - ApplyActionStale
                    type: string
                  count:
                    description: Count is how many reanalyses the incident has had.
                    format: int32
                    minimum: 1
                    type: integer
                  feedback:
                    description: Feedback is the request's feedback.
                    maxLength: 2000
                    type: string
                required:
                - at
                - count
                type: object
              reasoningTrace:
                description: ReasoningTrace is the ordered reasoning, each step citing
                  its sources.
                items:
                  description: ReasoningStep is one step of the reasoning trace.
                  properties:
                    evidenceRefs:
                      description: EvidenceRefs are the 0-based indices into status.sources
                        that back this step.
                      items:
                        format: int32
                        type: integer
                      type: array
                    statement:
                      description: Statement is what this step concludes.
                      type: string
                    step:
                      description: Step is the 1-based position of this step.
                      format: int32
                      type: integer
                  type: object
                type: array
              report:
                description: Report is the root-cause analysis in markdown.
                type: string
              resolution:
                description: Resolution records how the incident ended. It is set
                  exactly when state is Resolved or Closed.
                properties:
                  at:
                    description: At is when it ended.
                    format: date-time
                    type: string
                  by:
                    description: |-
                      By is what ended it: verify (state Resolved), or user, alert-gone or analysis-failed (state
                      Closed).
                    enum:
                    - verify
                    - user
                    - alert-gone
                    - analysis-failed
                    type: string
                required:
                - at
                - by
                type: object
              rootCause:
                description: RootCause is the analysis' conclusion.
                properties:
                  category:
                    description: |-
                      Category is the failure class: config, capacity, image, network, dependency, permission (an
                      RBAC or admission denial) or other.
                    enum:
                    - config
                    - capacity
                    - image
                    - network
                    - dependency
                    - permission
                    - other
                    type: string
                  confidence:
                    description: Confidence is a decimal string in [0, 1], e.g. "0.85".
                    type: string
                  owner:
                    description: |-
                      Owner is who must act on the root cause: customer or krateo, or unknown when the evidence
                      does not decide. Absent: the owner was not assessed. Writers derive it from ownerEvidence: a
                      chart or controller Krateo ships points to krateo; the values of a customer's composition, or
                      the customer's own external endpoint, point to customer. unknown never leads to a ticket
                      proposal. The controller does not read it: it changes neither the state nor resolution.by.
                    enum:
                    - customer
                    - krateo
                    - unknown
                    type: string
                  ownerEvidence:
                    description: OwnerEvidence is what the owner rests on, at most
                      8 pieces.
                    items:
                      description: OwnerEvidence is one piece of evidence for RootCause.Owner.
                      properties:
                        kind:
                          description: |-
                            Kind is what Ref points at: component (a chart or controller; one Krateo ships points to
                            krateo), config (an object holding configuration; a customer composition's values point to
                            customer), trace (a trace id) or log (the object that wrote the log line).
                          enum:
                          - component
                          - config
                          - trace
                          - log
                          type: string
                        note:
                          description: |-
                            Note says, in a sentence, why this evidence points to the owner, e.g. "chart shipped by
                            Krateo" or "endpoint is the customer's own API".
                          maxLength: 300
                          type: string
                        ref:
                          description: |-
                            Ref is an object reference, group/Kind/namespace/name (namespace empty for a cluster-scoped
                            object, group empty for the core group), or for kind trace a trace id.
                          maxLength: 512
                          minLength: 1
                          type: string
                      required:
                      - kind
                      - ref
                      type: object
                    maxItems: 8
                    type: array
                  statement:
                    description: Statement is the root cause.
                    type: string
                type: object
              sources:
                description: Sources is the evidence the analysis rests on. reasoningTrace
                  steps cite it by 0-based index.
                items:
                  description: Source is one piece of evidence the analysis rests
                    on.
                  properties:
                    excerpt:
                      description: Excerpt is the relevant part of the evidence, verbatim.
                      type: string
                    ref:
                      description: 'Ref is where the evidence came from: a query,
                        an object reference, a metric name.'
                      type: string
                    type:
                      description: Type is the kind of evidence.
                      enum:
                      - logs
                      - events
                      - metrics
                      - object
                      type: string
                  type: object
                type: array
              state:
                description: State is the lifecycle state. Writers set Analyzing in
                  the first status write.
                enum:
                - Analyzing
                - Open
                - Verifying
                - Resolved
                - Closed
                type: string
              verifyingSince:
                description: |-
                  VerifyingSince is when the incident last entered Verifying, or was applied again while
                  Verifying: the start of the settle window. It is set only while Verifying.
                format: date-time
                type: string
            type: object
            x-kubernetes-validations:
            - message: resolution is set exactly when state is Resolved or Closed
              rule: has(self.resolution) == (has(self.state) && self.state in ['Resolved',
                'Closed'])
            - message: Resolved goes with resolution.by verify, Closed with resolution.by
                user, alert-gone or analysis-failed
              rule: '!has(self.resolution) || (has(self.state) && ((self.resolution.by
                == ''verify'') == (self.state == ''Resolved'')))'
            - message: Resolved can only become Closed, and Closed is final
              rule: '!has(oldSelf.state) || !(oldSelf.state in [''Resolved'', ''Closed''])
                || (has(self.state) && (self.state == oldSelf.state || self.state
                == ''Closed''))'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
