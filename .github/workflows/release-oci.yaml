# Publishes both charts (incident-provider-crds, incident-provider) on a release tag, through the
# org reusable. It substitutes CHART_VERSION from the tag and waits for every image the charts
# reference, including the check image in the check pod template ConfigMap.
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the git tag."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: latest tag of the app repo."
        required: false
      dry_run:
        description: "Rehearse: run every check and push nothing. Untick to publish from a manual run."
        type: boolean
        default: true

jobs:
  release-oci:
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@7da11cb60cee5cbfc7d9e8c9328692807b43cefd # 2.0.0
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ github.event.inputs.chart_version || '' }}
      app_version: ${{ github.event.inputs.app_version || '' }}
      # A manual run rehearses unless unticked; a tag push always publishes.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # Installed by the installer, never listed in a Marketplace index.
      index_channel: none
