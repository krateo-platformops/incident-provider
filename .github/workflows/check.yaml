name: check

on:
  pull_request:
    branches:
      - main
      - 'release-*'
  push:
    branches:
      - main
      - 'release-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0
      - name: helm-unittest, for the charts' tests
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1
      - name: Build, vet, test, lint the charts and check the generated files are current
        run: make check
